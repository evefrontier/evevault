name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Build
        run: bun run build

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Report @evevault/shared coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@evevault/shared"
          json-summary-path: "./packages/shared/coverage/coverage-summary.json"
          json-final-path: "./packages/shared/coverage/coverage-final.json"
          vite-config-path: "./packages/shared/vitest.config.mts"

      - name: Report @evevault/extension coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@evevault/extension"
          json-summary-path: "./apps/extension/coverage/coverage-summary.json"
          json-final-path: "./apps/extension/coverage/coverage-final.json"
          vite-config-path: "./apps/extension/vitest.config.ts"

      - name: Report @evevault/web coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@evevault/web"
          json-summary-path: "./apps/web/coverage/coverage-summary.json"
          json-final-path: "./apps/web/coverage/coverage-final.json"
          vite-config-path: "./apps/web/vitest.config.ts"
