name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Report @evevault/shared coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@evevault/shared"
          json-summary-path: "./packages/shared/coverage/coverage-summary.json"
          json-final-path: "./packages/shared/coverage/coverage-final.json"
          vite-config-path: "./packages/shared/vitest.config.mts"

      - name: Report @evevault/extension coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "@evevault/extension"
          json-summary-path: "./apps/extension/coverage/coverage-summary.json"
          json-final-path: "./apps/extension/coverage/coverage-final.json"
          vite-config-path: "./apps/extension/vitest.config.ts"

  build:
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Build
        run: bun run build
