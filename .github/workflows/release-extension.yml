# Build extension → eve-vault-chrome.zip on release or manual run. Docs: docs/RELEASE_EXTENSION.md
name: Release extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-extension:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: write
    env:
      VITE_TENANT_STILLNESS_CLIENT_SECRET: ${{ secrets.VITE_TENANT_STILLNESS_CLIENT_SECRET }}
      VITE_TENANT_UTOPIA_CLIENT_SECRET: ${{ secrets.VITE_TENANT_UTOPIA_CLIENT_SECRET }}
      VITE_TENANT_TESTEVENET_CLIENT_SECRET: ${{ secrets.VITE_TENANT_TESTEVENET_CLIENT_SECRET }}
      VITE_TENANT_NEBULA_CLIENT_SECRET: ${{ secrets.VITE_TENANT_NEBULA_CLIENT_SECRET }}
      VITE_FUSIONAUTH_REDIRECT_URI: ${{ secrets.VITE_FUSIONAUTH_REDIRECT_URI }}
      VITE_ENOKI_API_KEY: ${{ secrets.VITE_ENOKI_API_KEY }}
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            VITE_TENANT_STILLNESS_CLIENT_SECRET \
            VITE_TENANT_UTOPIA_CLIENT_SECRET \
            VITE_TENANT_TESTEVENET_CLIENT_SECRET \
            VITE_TENANT_NEBULA_CLIENT_SECRET \
            VITE_FUSIONAUTH_REDIRECT_URI \
            VITE_ENOKI_API_KEY \
            EXTENSION_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
            echo "$name is set"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build:ext

      - name: Zip extension
        run: bun run zip
        working-directory: apps/extension

      - name: Copy zip to fixed name
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/extension/.output/*-chrome.zip)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Error: No Chrome ZIP found matching 'apps/extension/.output/*-chrome.zip'."
            exit 1
          fi

          if [ "${#files[@]}" -gt 1 ]; then
            echo "Error: Multiple Chrome ZIPs found matching 'apps/extension/.output/*-chrome.zip':"
            printf '  %s\n' "${files[@]}"
            exit 1
          fi

          cp "${files[0]}" ./eve-vault-chrome.zip

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" eve-vault-chrome.zip --clobber

      - name: Upload artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: eve-vault-chrome
          path: eve-vault-chrome.zip
