# Build extension → eve-vault-chrome.zip + eve-vault-firefox.zip on release or manual run. Docs: docs/RELEASE_EXTENSION.md
name: Release extension

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  EXTENSION_ZIP: eve-vault-chrome.zip
  FIREFOX_ZIP: eve-vault-firefox.zip
  CHECKSUMS_FILE: checksums.txt
  ATTESTATION_FILE: eve-vault-chrome.attestation.json

jobs:
  build-extension:
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      packages: read
    env:
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            EXTENSION_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
            echo "$name is set"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare extension
        timeout-minutes: 1
        run: bun --cwd apps/extension run postinstall

      - name: Build extension
        run: bun run build:ext

      - name: Zip extension
        run: bun run zip && bun run zip:firefox
        working-directory: apps/extension

      - name: Copy zips to fixed names
        run: |
          set -euo pipefail
          shopt -s nullglob

          copy_single() {
            local glob="$1" dest="$2" label="$3"
            local files=($glob)

            if [ "${#files[@]}" -eq 0 ]; then
              echo "Error: No $label ZIP found matching '$glob'."
              exit 1
            fi

            if [ "${#files[@]}" -gt 1 ]; then
              echo "Error: Multiple $label ZIPs found matching '$glob':"
              printf '  %s\n' "${files[@]}"
              exit 1
            fi

            cp "${files[0]}" "$dest"
          }

          copy_single 'apps/extension/.output/*-chrome.zip' "./${EXTENSION_ZIP}" Chrome
          copy_single 'apps/extension/.output/*-firefox.zip' "./${FIREFOX_ZIP}" Firefox

      - name: Generate checksums
        run: sha256sum "${EXTENSION_ZIP}" "${FIREFOX_ZIP}" > "${CHECKSUMS_FILE}"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: release-extension-build-assets
          path: |
            ${{ env.EXTENSION_ZIP }}
            ${{ env.FIREFOX_ZIP }}
            ${{ env.CHECKSUMS_FILE }}

  attest-extension:
    runs-on: ubuntu-latest
    needs: build-extension
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: release-extension-build-assets
          path: .

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ env.CHECKSUMS_FILE }}

      - name: Copy attestation to fixed name
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${ATTESTATION_FILE}"

      - name: Upload attestation asset
        uses: actions/upload-artifact@v4
        with:
          name: release-extension-attestation
          path: ${{ env.ATTESTATION_FILE }}

  publish-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - build-extension
      - attest-extension
    permissions:
      contents: write
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: release-extension-build-assets
          path: .

      - name: Download attestation asset
        uses: actions/download-artifact@v4
        with:
          name: release-extension-attestation
          path: .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            "${EXTENSION_ZIP}" \
            "${FIREFOX_ZIP}" \
            "${CHECKSUMS_FILE}" \
            "${ATTESTATION_FILE}" \
            --repo "${{ github.repository }}" \
            --clobber

  upload-manual-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build-extension
      - attest-extension
    permissions: {}
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: release-extension-build-assets
          path: .

      - name: Download attestation asset
        uses: actions/download-artifact@v4
        with:
          name: release-extension-attestation
          path: .

      - name: Upload artifact (manual run)
        uses: actions/upload-artifact@v4
        with:
          name: eve-vault-extension
          path: |
            ${{ env.EXTENSION_ZIP }}
            ${{ env.FIREFOX_ZIP }}
            ${{ env.CHECKSUMS_FILE }}
            ${{ env.ATTESTATION_FILE }}
