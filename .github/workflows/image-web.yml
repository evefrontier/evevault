name: Image (web)

# One web image per architecture for each web release, pushed under every
# tier's tag: <version>-<tier>-<arch>. The bundle has no tier config; the app
# picks its tenants from window.location.origin.
on:
  push:
    tags: ["web/v*"]
  workflow_dispatch:

concurrency:
  group: image-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: frontier/eve-frontier-evevault-web
  ECR_PUSH_ROLE_ARN: arn:aws:iam::284949645555:role/github-oidc-evevault
  TIERS: dev test uat ptu live
  # scan-action's default Grype (0.110) cannot parse bun.lock; 0.121 can.
  GRYPE_VERSION: v0.121.0

# Release images must not restore caches that other workflows could have
# written (cache poisoning), including scan-action's Grype vulnerability DB.
cache-mode: none

# Jobs declare the permissions they need; anything else gets none.
permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify release tag matches package version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != web/v* ]]; then
            echo "Run on a web/v* tag, not ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          version="$(node -p "require('./apps/web/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "web/v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Scan sources with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          path: .
          fail-build: true
          severity-cutoff: critical
          output-format: table
          cache-db: false

  image:
    name: image (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: evevault-web:grype
          build-args: BUILD_COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          image: evevault-web:grype
          fail-build: true
          severity-cutoff: critical
          output-format: table
          cache-db: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-evevault-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve tags
        id: tags
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "tags<<EOF"
            for tier in $TIERS; do echo "${IMAGE}:${VERSION}-${tier}-${ARCH}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Same inputs as the scanned build, so every layer is a cache hit and the
      # pushed image is the one Grype passed.
      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: BUILD_COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "Pushed:"
            while read -r tag; do echo "- \`${tag}\`"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
