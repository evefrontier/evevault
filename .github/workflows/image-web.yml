name: Image (web)

# One web image per tier and architecture for each release (v* tag), pushed as
# <version>-<tier>-<arch>. Each tier's bundle lists only that tier's servers
# (VITE_TIER; dev lists all of them). A manual run builds and scans every image
# without pushing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-web-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: frontier/eve-frontier-evevault-web
  ECR_PUSH_ROLE_ARN: arn:aws:iam::284949645555:role/github-oidc-evevault
  TIERS: dev test uat ptu live
  # scan-action's default Grype (0.110) cannot parse bun.lock; 0.121 can.
  GRYPE_VERSION: v0.121.0

# Release images must not restore caches that other workflows could have
# written (cache poisoning), including scan-action's Grype vulnerability DB.
cache-mode: none

# Jobs declare the permissions they need; anything else gets none.
permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      push: ${{ steps.version.outputs.push }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Tag pushes must match the package version and push; manual runs never push.
      - name: Verify release tag matches package version
        id: version
        run: |
          version="$(node -p "require('./apps/web/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
              exit 1
            fi
            push=true
          else
            push=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - name: Scan sources with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          path: .
          fail-build: true
          severity-cutoff: critical
          output-format: table
          cache-db: false

  image:
    name: image (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: false

      # One builder for every tier: the Caddy, root and bun install layers are
      # built once and reused; only the bundle differs per tier.
      - name: Build images for scanning
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tier in $TIERS; do
            docker buildx build \
              --file apps/web/Dockerfile \
              --platform "linux/${ARCH}" \
              --build-arg "TIER=${tier}" \
              --build-arg "BUILD_COMMIT=${BUILD_COMMIT}" \
              --secret id=github_token,env=GITHUB_TOKEN \
              --tag "evevault-web:${tier}" \
              --load \
              .
          done

      - name: Scan images with Grype
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -euo pipefail
          for tier in $TIERS; do
            "$GRYPE" "docker:evevault-web:${tier}" --fail-on critical --output table
          done

      - name: Configure AWS credentials
        if: needs.version.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-evevault-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.version.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Push the images Grype passed, only once every tier has passed; a
      # rebuild could pick up newer base images.
      - name: Push scanned images
        if: needs.version.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          for tier in $TIERS; do
            tag="${IMAGE}:${VERSION}-${tier}-${ARCH}"
            docker tag "evevault-web:${tier}" "$tag"
            docker push "$tag"
            echo "- \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Summarize dry run
        if: needs.version.outputs.push != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "Built and scanned, not pushed (manual run):" >> "$GITHUB_STEP_SUMMARY"
          for tier in $TIERS; do
            echo "- \`evevault-web:${tier}\` (${ARCH})" >> "$GITHUB_STEP_SUMMARY"
          done
