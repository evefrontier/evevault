version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - command -v unzip >/dev/null 2>&1 || yum install -y unzip || sudo yum install -y unzip
            - curl -fsSL https://bun.com/install | bash -s "bun-v1.3.13"
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - export HUSKY=0
            - bun --version
            - test -n "$GITHUB_PACKAGES_TOKEN" || (echo "GITHUB_PACKAGES_TOKEN is required for GitHub Packages" && exit 1)
            - export GITHUB_TOKEN="$GITHUB_PACKAGES_TOKEN"
            - 'printf "@evefrontier:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}\n" > .npmrc'
            - time bun install --frozen-lockfile --linker hoisted --filter './' --filter './apps/web' --filter './packages/shared'
        build:
          commands:
            - export BUN_INSTALL="$HOME/.bun"
            - export PATH="$BUN_INSTALL/bin:$PATH"
            - cd apps/web && time env -u NODE_OPTIONS bunx --bun vite build
      artifacts:
        baseDirectory: apps/web/dist
        files:
          - "**/*"
