version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yum install -y rsync
        - curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.1"
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun install
    build:
      commands:
        - export PATH="$HOME/.bun/bin:$PATH"
        - bun run build
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.bun/install/cache/**/*
